apiVersion: apps/v1
kind: Deployment
metadata:
  name: <APP_NAME>-server
  namespace: default
  labels:
    app: <APP_NAME>-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <APP_NAME>-server
  template:
    metadata:
      labels:
        app: <APP_NAME>-server
    spec:
      serviceAccountName: <SERVICE_ACCOUNT_NAME>
      containers:
      - name: <CONTAINER_NAME>
        image: <REPO_URL>
        ports:
        - containerPort: <SERVICE_PORT>
          protocol: TCP
        env:
        - name: DYNAMODB_TABLE
          value: "<DYNAMODB_TABLE>"
        - name: AWS_DEFAULT_REGION
          value: "<AWS_REGION>"
        resources:
          requests:
            memory: "512Mi"
            cpu: "256m"
          limits:
            memory: "1Gi"
            cpu: "512m"
        livenessProbe:
          httpGet:
            path: /status
            port: <SERVICE_PORT>
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: <SERVICE_PORT>
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: <APP_NAME>-server-service
  namespace: default
  labels:
    app: <APP_NAME>-server
spec:
  selector:
    app: <APP_NAME>-server
  ports:
  - port: 80
    targetPort: <SERVICE_PORT>
    protocol: TCP
  type: ClusterIP 